<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fff4f7">
  <title>RSVP · Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="rsvp-page">
  <div class="petal-field" aria-hidden="true">
    <span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span>
  </div>
  <main class="rsvp-shell">
    <div class="rsvp-card" id="rsvp-app">
      <p class="eyebrow">Wedding RSVP</p>
      <h1 id="rsvp-title">You’re invited</h1>
      <p class="hint" id="rsvp-subtitle">Loading your invitation…</p>
      <form id="rsvp-form" hidden novalidate>
        <p class="form-error" id="rsvp-error" role="alert" hidden></p>
        <label class="field">
          <span>Guest name</span>
          <input type="text" id="rsvp-name" readonly>
        </label>
        <label class="field">
          <span>Your response</span>
          <select id="rsvp-status" required>
            <option value="Confirmed">Joyfully attending</option>
            <option value="Maybe">Maybe</option>
            <option value="Declined">Unable to attend</option>
          </select>
        </label>
        <div class="split">
          <label class="field">
            <span>Adults</span>
            <input type="number" id="rsvp-adults" min="0" step="1" value="1">
          </label>
          <label class="field">
            <span>Children</span>
            <input type="number" id="rsvp-children" min="0" step="1" value="0">
          </label>
        </div>
        <div class="split">
          <label class="field">
            <span>Need stay?</span>
            <select id="rsvp-stay">
              <option value="No">No</option>
              <option value="Yes">Yes</option>
              <option value="Maybe">Maybe</option>
            </select>
          </label>
          <label class="field">
            <span>Travel / pickup</span>
            <select id="rsvp-travel">
              <option value="No">No</option>
              <option value="Yes">Yes</option>
              <option value="Pickup Needed">Pickup Needed</option>
            </select>
          </label>
        </div>
        <label class="field">
          <span>Note (optional)</span>
          <textarea id="rsvp-notes" rows="3" placeholder="Any message for the hosts"></textarea>
        </label>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary" id="rsvp-submit">Send RSVP</button>
        </div>
      </form>
      <div id="rsvp-done" class="empty" hidden>
        <span class="empty-emoji">💐</span>
        <p id="rsvp-done-text">Thank you! Your RSVP was saved.</p>
      </div>
    </div>
  </main>
  <script>
    const SYNC_API_URL = "https://script.google.com/macros/s/AKfycbwwmRmRZU-2tFSplx1jr--PJJeEVMWZwg2E37iXHjS9_d2iuZjDuUOnr6uYO_uLmIyr/exec";

    function qs(name) {
      return new URLSearchParams(window.location.search).get(name) || "";
    }

    function jsonp(url, params) {
      return new Promise((resolve, reject) => {
        const callbackName = "rsvpCb" + Date.now() + Math.random().toString(36).slice(2, 6);
        const script = document.createElement("script");
        const cleanup = () => {
          script.remove();
          try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
          clearTimeout(timer);
        };
        window[callbackName] = (payload) => { cleanup(); resolve(payload); };
        script.onerror = () => { cleanup(); reject(new Error("Could not reach the invitation server.")); };
        const timer = setTimeout(() => { cleanup(); reject(new Error("Request timed out.")); }, 20000);
        const search = new URLSearchParams(params || {});
        search.set("prefix", callbackName);
        search.set("_", String(Date.now()));
        script.src = url + (url.includes("?") ? "&" : "?") + search.toString();
        document.head.appendChild(script);
      });
    }

    async function boot() {
      const guestId = qs("g") || qs("id");
      const title = document.getElementById("rsvp-title");
      const subtitle = document.getElementById("rsvp-subtitle");
      const form = document.getElementById("rsvp-form");
      const error = document.getElementById("rsvp-error");

      if (!guestId) {
        title.textContent = "RSVP link missing";
        subtitle.textContent = "Open the personal link from your WhatsApp invitation.";
        return;
      }

      try {
        const remote = await jsonp(SYNC_API_URL, { action: "rsvpGet", id: guestId });
        if (!remote || remote.ok === false) throw new Error((remote && remote.error) || "Invitation not found");
        const guest = remote.guest;
        const settings = remote.settings || {};
        title.textContent = guest.name ? `Dear ${guest.name}` : "You’re invited";
        const bits = [settings.coupleNames, settings.engagementDate && `Engagement: ${settings.engagementDate}`, settings.weddingDate && `Wedding: ${settings.weddingDate}`].filter(Boolean);
        subtitle.textContent = bits.join(" · ") || "Please share your response below.";
        document.getElementById("rsvp-name").value = guest.name || "";
        document.getElementById("rsvp-adults").value = String(guest.adults || 1);
        document.getElementById("rsvp-children").value = String(guest.children || 0);
        document.getElementById("rsvp-stay").value = guest.stay || "No";
        document.getElementById("rsvp-travel").value = guest.travel || "No";
        if (["Confirmed", "Maybe", "Declined"].includes(guest.rsvp)) {
          document.getElementById("rsvp-status").value = guest.rsvp;
        }
        form.hidden = false;
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          error.hidden = true;
          const submitBtn = document.getElementById("rsvp-submit");
          submitBtn.disabled = true;
          try {
            const result = await jsonp(SYNC_API_URL, {
              action: "rsvpSubmit",
              id: guestId,
              rsvp: document.getElementById("rsvp-status").value,
              adults: document.getElementById("rsvp-adults").value,
              children: document.getElementById("rsvp-children").value,
              stay: document.getElementById("rsvp-stay").value,
              travel: document.getElementById("rsvp-travel").value,
              notes: document.getElementById("rsvp-notes").value.trim()
            });
            if (!result || result.ok === false) throw new Error((result && result.error) || "Could not save RSVP");
            form.hidden = true;
            document.getElementById("rsvp-done").hidden = false;
            document.getElementById("rsvp-done-text").textContent = `Thank you! Marked as ${result.rsvp}.`;
          } catch (err) {
            error.hidden = false;
            error.textContent = err.message || "Could not save RSVP";
            submitBtn.disabled = false;
          }
        });
      } catch (err) {
        title.textContent = "Invitation unavailable";
        subtitle.textContent = err.message || "Please ask the hosts for a fresh RSVP link.";
      }
    }

    boot();
  </script>
</body>
</html>
